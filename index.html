<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .modal {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        .modal.hidden {
            opacity: 0;
            transform: scale(0.95);
        }
        /* Print styles to hide non-essential UI */
        @media print {
            body {
                background-color: #fff;
            }
            .no-print {
                display: none !important;
            }
            .print-area {
                width: 100%;
                margin: 0;
                padding: 0;
                box-shadow: none;
                border: none;
            }
            /* Show chart and table only */
            #chart-section, #table-section {
                display: block !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4 md:p-8">

    <!-- Firebase SDKs - Loaded via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, setDoc, doc, setLogLevel, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global variables provided by the environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = {
apiKey: "AIzaSyBhWsjTfF2191NGV9VRT_L2PjPxO8Fm8js",
  authDomain: "health-tracker-d1bad.firebaseapp.com",
  projectId: "health-tracker-d1bad",
  storageBucket: "health-tracker-d1bad.firebasestorage.app",
  messagingSenderId: "1041512043894",
  appId: "1:1041512043894:web:9ba1494143fe863ed71657",
  measurementId: "G-SJCER4MWR4"
};

        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // Initialize Firebase services
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Set log level for debugging
        setLogLevel('Debug');

        let currentSelectedUserId = null;
        let currentSelectedUserName = '';
        let unsubscribeReadings = null;
        let unsubscribeUsers = null;
        let healthChart = null;
        let allReadings = [];

        // Function to authenticate the user and start the app
        async function authenticateAndLoadApp() {
            try {
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        console.log("User authenticated with UID:", user.uid);
                        startListeningForUsers();
                    } else {
                        console.log("No user authenticated.");
                    }
                });
            } catch (error) {
                console.error("Authentication Error:", error);
                showMessageModal("Authentication Error", "Failed to sign in. Please check your network connection.");
            }
        }
        
        // Start listening for changes to the list of user profiles
        function startListeningForUsers() {
            if (unsubscribeUsers) {
                unsubscribeUsers();
            }
            
            // This is a public collection so all users are visible
            const usersCollectionRef = collection(db, `artifacts/${appId}/public/data/userProfiles`);
            const q = query(usersCollectionRef);

            unsubscribeUsers = onSnapshot(q, (snapshot) => {
                const users = [];
                snapshot.forEach(doc => {
                    users.push({ id: doc.id, ...doc.data() });
                });
                displayUsers(users);
                showScreen('user-list-screen');
            }, (error) => {
                console.error("Firestore Error (Users):", error);
                showMessageModal("Data Error", "Failed to load user profiles due to permissions. Please ensure your authentication token is valid.");
            });
        }

        // Function to select a user and navigate to the dashboard
        function selectUser(user) {
            currentSelectedUserId = user.id;
            currentSelectedUserName = user.name;
            document.getElementById('current-user-name').textContent = `${currentSelectedUserName} (${currentSelectedUserId})`;
            startListeningForReadings(currentSelectedUserId);
            showScreen('dashboard-screen');
        }

        // Function to start real-time listening for readings for a specific user
        function startListeningForReadings(userId) {
            if (!userId) {
                console.error("No user ID selected.");
                return;
            }
            if (unsubscribeReadings) {
                unsubscribeReadings();
            }

            // This is also a public collection, with readings tagged by userId
            const readingsCollectionRef = collection(db, `artifacts/${appId}/public/data/healthReadings`);
            const q = query(readingsCollectionRef);

            unsubscribeReadings = onSnapshot(q, (snapshot) => {
                const filteredReadings = [];
                snapshot.forEach(doc => {
                    const reading = { id: doc.id, ...doc.data() };
                    if (reading.userId === userId) {
                        filteredReadings.push(reading);
                    }
                });
                allReadings = filteredReadings.sort((a, b) => b.timestamp - a.timestamp);
                displayReadings(allReadings);
                updateChart(allReadings);
            }, (error) => {
                console.error("Firestore Error:", error);
                showMessageModal("Data Error", "Failed to load health readings. Please check permissions.");
            });
        }

        // Function to save a reading to Firestore
        async function saveReading(type, data) {
            if (!currentSelectedUserId) {
                console.error("No user selected.");
                return;
            }
            try {
                const readingsCollectionRef = collection(db, `artifacts/${appId}/public/data/healthReadings`);
                await addDoc(readingsCollectionRef, {
                    type,
                    ...data,
                    userId: currentSelectedUserId, // Tag reading with the selected user's ID
                    timestamp: Date.now()
                });
                console.log("Reading saved successfully!");
            } catch (e) {
                console.error("Error adding document: ", e);
                showMessageModal("Save Error", "Failed to save reading. Please check permissions and try again.");
            }
        }

        // Function to create a new user profile
        async function createNewUser() {
            const userName = document.getElementById('new-user-name').value.trim();
            if (!userName) {
                showMessageModal("Input Required", "User name cannot be empty.");
                return;
            }
            
            try {
                const usersCollectionRef = collection(db, `artifacts/${appId}/public/data/userProfiles`);
                const newUserDoc = doc(usersCollectionRef); // Create a new doc with an auto-generated ID
                await setDoc(newUserDoc, {
                    id: newUserDoc.id,
                    name: userName,
                    createdAt: Date.now()
                });
                console.log("New user profile created:", userName);
                // After creating, automatically select this new user
                selectUser({ id: newUserDoc.id, name: userName });
            } catch (error) {
                console.error("Error creating new user:", error);
                showMessageModal("Creation Error", "Failed to create new user profile. Please check permissions and try again.");
            }
        }
        
        // Function to download data as a text file
        function downloadDataAsTextFile() {
            if (allReadings.length === 0) {
                showMessageModal("No Data", "There are no readings to download.");
                return;
            }

            let dataString = 'Health Readings Report\n\n';
            dataString += `Report for: ${currentSelectedUserName} (ID: ${currentSelectedUserId})\n\n`;
            dataString += 'Type,Value,Date,Time\n';

            allReadings.forEach(reading => {
                const date = new Date(reading.timestamp).toLocaleDateString();
                const time = new Date(reading.timestamp).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
                let value = '';

                if (reading.type === 'BP') {
                    value = `${reading.systolic}/${reading.diastolic} mmHg`;
                } else if (reading.type === 'Pulse') {
                    value = `${reading.pulse} bpm`;
                } else if (reading.type === 'Sugar') {
                    value = `${reading.sugar} mg/dL (${reading.sugarType})`;
                }

                dataString += `${reading.type},"${value}",${date},${time}\n`;
            });

            const blob = new Blob([dataString], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentSelectedUserName.replace(/\s/g, '_')}-health-data.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Helper function to switch between screens
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        window.onload = function() {
            authenticateAndLoadApp();

            // Setup UI interactions
            // Corrected ID to match the HTML
            document.getElementById('create-new-user-btn').addEventListener('click', createNewUser);
            
            document.getElementById('switch-user-btn').addEventListener('click', () => {
                if (unsubscribeReadings) {
                    unsubscribeReadings();
                }
                showScreen('user-list-screen');
            });

            document.getElementById('open-bp-modal').addEventListener('click', () => showModal('bp-modal'));
            document.getElementById('open-pulse-modal').addEventListener('click', () => showModal('pulse-modal'));
            document.getElementById('open-sugar-modal').addEventListener('click', () => showModal('sugar-modal'));
            
            document.getElementById('print-report-btn').addEventListener('click', () => {
                // Ensure chart view is active before printing
                document.getElementById('chart-tab-btn').click();
                window.print();
            });
            
            document.getElementById('download-data-btn').addEventListener('click', downloadDataAsTextFile);

            document.querySelectorAll('.close-modal-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    hideModal(e.target.closest('.modal').id);
                });
            });

            document.getElementById('submit-bp').addEventListener('click', () => {
                const systolic = document.getElementById('systolic').value;
                const diastolic = document.getElementById('diastolic').value;
                if (systolic && diastolic) {
                    saveReading('BP', { systolic: parseInt(systolic, 10), diastolic: parseInt(diastolic, 10) });
                    hideModal('bp-modal');
                    document.getElementById('systolic').value = '';
                    document.getElementById('diastolic').value = '';
                }
            });

            document.getElementById('submit-pulse').addEventListener('click', () => {
                const pulse = document.getElementById('pulse').value;
                if (pulse) {
                    saveReading('Pulse', { pulse: parseInt(pulse, 10) });
                    hideModal('pulse-modal');
                    document.getElementById('pulse').value = '';
                }
            });

            document.getElementById('submit-sugar').addEventListener('click', () => {
                const sugar = document.getElementById('sugar').value;
                const sugarType = document.querySelector('input[name="sugar-type"]:checked')?.value;
                if (sugar && sugarType) {
                    saveReading('Sugar', { sugar: parseInt(sugar, 10), sugarType });
                    hideModal('sugar-modal');
                    document.getElementById('sugar').value = '';
                }
            });

            // Tab functionality for charts and tables
            const chartTabBtn = document.getElementById('chart-tab-btn');
            const tableTabBtn = document.getElementById('table-tab-btn');
            const chartSection = document.getElementById('chart-section');
            const tableSection = document.getElementById('table-section');

            chartTabBtn.addEventListener('click', () => {
                chartTabBtn.classList.add('bg-indigo-600', 'text-white');
                chartTabBtn.classList.remove('bg-gray-200', 'text-gray-700');
                tableTabBtn.classList.add('bg-gray-200', 'text-gray-700');
                tableTabBtn.classList.remove('bg-indigo-600', 'text-white');
                chartSection.classList.remove('hidden');
                tableSection.classList.add('hidden');
            });

            tableTabBtn.addEventListener('click', () => {
                tableTabBtn.classList.add('bg-indigo-600', 'text-white');
                tableTabBtn.classList.remove('bg-gray-200', 'text-gray-700');
                chartTabBtn.classList.add('bg-gray-200', 'text-gray-700');
                chartTabBtn.classList.remove('bg-indigo-600', 'text-white');
                tableSection.classList.remove('hidden');
                chartSection.classList.add('hidden');
            });
        }; // End of window.onload

        function displayUsers(users) {
            const userListContainer = document.getElementById('user-list-container');
            userListContainer.innerHTML = '';
            if (users.length === 0) {
                userListContainer.innerHTML = '<p class="text-center text-gray-500">No users found. Please create one.</p>';
            } else {
                // Sort users by name for a consistent list
                users.sort((a, b) => a.name.localeCompare(b.name));
                users.forEach(user => {
                    const userDiv = document.createElement('button');
                    userDiv.className = 'w-full p-4 bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow flex flex-col items-start justify-center text-left';
                    userDiv.innerHTML = `
                        <span class="text-lg font-semibold text-indigo-700">${user.name}</span>
                        <span class="text-sm text-gray-500 truncate w-full">ID: ${user.id}</span>
                    `;
                    userDiv.addEventListener('click', () => selectUser(user));
                    userListContainer.appendChild(userDiv);
                });
            }
        }

        function updateChart(readings) {
            const bpReadings = readings.filter(r => r.type === 'BP').sort((a, b) => a.timestamp - b.timestamp);
            const pulseReadings = readings.filter(r => r.type === 'Pulse').sort((a, b) => a.timestamp - b.timestamp);
            const sugarReadings = readings.filter(r => r.type === 'Sugar').sort((a, b) => a.timestamp - b.timestamp);

            const allTimestamps = [...new Set([
                ...bpReadings.map(r => new Date(r.timestamp).toLocaleDateString()),
                ...pulseReadings.map(r => new Date(r.timestamp).toLocaleDateString()),
                ...sugarReadings.map(r => new Date(r.timestamp).toLocaleDateString())
            ])].sort();

            const chartConfig = {
                type: 'line',
                data: {
                    labels: allTimestamps,
                    datasets: [
                        {
                            label: 'Systolic BP',
                            data: bpReadings.map(r => ({ x: new Date(r.timestamp).toLocaleDateString(), y: r.systolic })),
                            borderColor: '#4338ca',
                            backgroundColor: 'rgba(67, 56, 202, 0.1)',
                            fill: false,
                            tension: 0.4
                        },
                        {
                            label: 'Diastolic BP',
                            data: bpReadings.map(r => ({ x: new Date(r.timestamp).toLocaleDateString(), y: r.diastolic })),
                            borderColor: '#818cf8',
                            backgroundColor: 'rgba(129, 140, 248, 0.1)',
                            fill: false,
                            tension: 0.4
                        },
                        {
                            label: 'Pulse',
                            data: pulseReadings.map(r => ({ x: new Date(r.timestamp).toLocaleDateString(), y: r.pulse })),
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            fill: false,
                            tension: 0.4
                        },
                        {
                            label: 'Blood Sugar',
                            data: sugarReadings.map(r => ({ x: new Date(r.timestamp).toLocaleDateString(), y: r.sugar })),
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            fill: false,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'category',
                            title: {
                                display: true,
                                text: 'Date',
                                font: { weight: 'bold' }
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Reading',
                                font: { weight: 'bold' }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom',
                        }
                    }
                }
            };
            const ctx = document.getElementById('healthChart');
            if (healthChart) {
                healthChart.destroy();
            }
            healthChart = new Chart(ctx, chartConfig);
        }

        // Function to render the readings table
        function displayReadings(readings) {
            const tableBody = document.getElementById('readings-table-body');
            tableBody.innerHTML = '';
            if (readings.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" class="py-4 text-center text-gray-500">No readings found.</td></tr>';
                return;
            }
            readings.forEach(reading => {
                const row = document.createElement('tr');
                row.className = 'border-b last:border-b-0';
                const typeCell = document.createElement('td');
                typeCell.className = 'py-3 px-4 text-sm font-medium text-gray-900';
                typeCell.textContent = reading.type;
                const valueCell = document.createElement('td');
                valueCell.className = 'py-3 px-4 text-sm text-gray-600';
                if (reading.type === 'BP') {
                    valueCell.textContent = `${reading.systolic}/${reading.diastolic} mmHg`;
                } else if (reading.type === 'Pulse') {
                    valueCell.textContent = `${reading.pulse} bpm`;
                } else if (reading.type === 'Sugar') {
                    valueCell.textContent = `${reading.sugar} mg/dL (${reading.sugarType})`;
                }
                const dateCell = document.createElement('td');
                dateCell.className = 'py-3 px-4 text-sm text-gray-600';
                dateCell.textContent = new Date(reading.timestamp).toLocaleDateString();
                const timeCell = document.createElement('td');
                timeCell.className = 'py-3 px-4 text-sm text-gray-600';
                timeCell.textContent = new Date(reading.timestamp).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
                row.appendChild(typeCell);
                row.appendChild(valueCell);
                row.appendChild(dateCell);
                row.appendChild(timeCell);
                tableBody.appendChild(row);
            });
        }

        // Helper functions for modals
        function showModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
        }

        function hideModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
        }

        function showMessageModal(title, message) {
            document.getElementById('message-modal-title').textContent = title;
            document.getElementById('message-modal-message').textContent = message;
            showModal('message-modal');
        }
    </script>

    <!-- User List Screen -->
    <div id="user-list-screen" class="screen w-full max-w-xl mx-auto bg-white rounded-3xl shadow-2xl p-8 border border-gray-200">
        <h1 class="text-3xl font-extrabold text-indigo-700 mb-6 text-center">Select a User</h1>
        
        <div id="user-list-container" class="space-y-4 mb-6">
            <!-- User buttons will be inserted here by JavaScript -->
        </div>

        <div class="flex flex-col gap-4">
            <input type="text" id="new-user-name" placeholder="Enter a new name" class="p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors" />
            <button id="create-new-user-btn" class="bg-indigo-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:bg-indigo-700 transition-colors">Create New User</button>
        </div>
    </div>

    <!-- Main Dashboard Screen -->
    <div id="dashboard-screen" class="screen hidden max-w-4xl w-full mx-auto bg-white rounded-3xl shadow-2xl p-6 md:p-10 border border-gray-200 print-area">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row items-center justify-between pb-6 border-b border-gray-200 mb-6 no-print">
            <h1 class="text-3xl md:text-4xl font-extrabold text-indigo-700 mb-2 md:mb-0">
                Health Manager
            </h1>
            <div class="flex items-center space-x-2">
                <span class="text-gray-600 text-sm">User:</span>
                <span id="current-user-name" class="text-md text-gray-800 font-bold bg-gray-100 px-3 py-1 rounded-full"></span>
                <button id="switch-user-btn" class="text-indigo-500 hover:text-indigo-700 transition-colors duration-200 font-medium text-sm">
                    (Switch User)
                </button>
            </div>
        </div>

        <!-- User Options Section -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mb-8 no-print">
            <button id="open-bp-modal" class="flex flex-col items-center justify-center p-6 bg-gradient-to-br from-indigo-500 to-purple-600 text-white rounded-2xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105 duration-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m-2-4h2m-4 0a2 2 0 002 2h2a2 2 0 002-2m4 0V9a2 2 0 00-2-2h-2a2 2 0 00-2 2v10a2 2 0 002 2h2a2 2 0 002-2z" />
                </svg>
                <span class="text-lg font-semibold">Blood Pressure</span>
            </button>
            <button id="open-pulse-modal" class="flex flex-col items-center justify-center p-6 bg-gradient-to-br from-teal-500 to-emerald-600 text-white rounded-2xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105 duration-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
                <span class="text-lg font-semibold">Pulse</span>
            </button>
            <button id="open-sugar-modal" class="flex flex-col items-center justify-center p-6 bg-gradient-to-br from-yellow-500 to-orange-600 text-white rounded-2xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105 duration-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="text-lg font-semibold">Blood Sugar</span>
            </button>
        </div>
        <!-- Print and Download Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 w-full mb-8 no-print">
            <button id="print-report-btn" class="flex-1 bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:bg-indigo-600 transition-colors duration-200">
                Print Report
            </button>
            <button id="download-data-btn" class="flex-1 bg-gray-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:bg-gray-600 transition-colors duration-200">
                Download Data
            </button>
        </div>

        <!-- Data Visualization Section -->
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Reading History</h2>
            <!-- Tab buttons -->
            <div class="flex rounded-xl bg-gray-200 p-1 mb-4 no-print">
                <button id="chart-tab-btn" class="flex-1 py-2 px-4 text-sm font-medium rounded-xl text-white bg-indigo-600 shadow transition-colors">Chart View</button>
                <button id="table-tab-btn" class="flex-1 py-2 px-4 text-sm font-medium rounded-xl text-gray-700 hover:bg-gray-300 transition-colors">Table View</button>
            </div>

            <!-- Chart Section -->
            <div id="chart-section" class="w-full bg-gray-50 rounded-2xl p-4 md:p-6 shadow-inner">
                <canvas id="healthChart" class="w-full h-80 md:h-96"></canvas>
            </div>

            <!-- Table Section (hidden by default) -->
            <div id="table-section" class="hidden w-full bg-gray-50 rounded-2xl p-4 md:p-6 shadow-inner overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-100">
                        <tr>
                            <th scope="col" class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Type</th>
                            <th scope="col" class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Value</th>
                            <th scope="col" class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Date</th>
                            <th scope="col" class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Time</th>
                        </tr>
                    </thead>
                    <tbody id="readings-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- Reading rows will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- BP Modal -->
    <div id="bp-modal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-50 hidden no-print">
        <div class="bg-white rounded-3xl p-8 md:p-10 max-w-lg w-full shadow-2xl relative transform scale-100">
            <button class="close-modal-btn absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <h3 class="text-2xl font-bold mb-6 text-gray-800">Add Blood Pressure Reading</h3>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div>
                    <label for="systolic" class="block text-sm font-medium text-gray-700 mb-2">Systolic (mmHg)</label>
                    <input type="number" id="systolic" placeholder="e.g., 120" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors" />
                </div>
                <div>
                    <label for="diastolic" class="block text-sm font-medium text-gray-700 mb-2">Diastolic (mmHg)</label>
                    <input type="number" id="diastolic" placeholder="e.g., 80" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors" />
                </div>
            </div>
            <button id="submit-bp" class="w-full bg-indigo-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:bg-indigo-700 transition-colors">Save Reading</button>
        </div>
    </div>

    <!-- Pulse Modal -->
    <div id="pulse-modal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-50 hidden no-print">
        <div class="bg-white rounded-3xl p-8 md:p-10 max-w-lg w-full shadow-2xl relative transform scale-100">
            <button class="close-modal-btn absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <h3 class="text-2xl font-bold mb-6 text-gray-800">Add Pulse Reading</h3>
            <div class="mb-6">
                <label for="pulse" class="block text-sm font-medium text-gray-700 mb-2">Pulse (bpm)</label>
                <input type="number" id="pulse" placeholder="e.g., 72" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors" />
            </div>
            <button id="submit-pulse" class="w-full bg-indigo-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:bg-indigo-700 transition-colors">Save Reading</button>
        </div>
    </div>

    <!-- Blood Sugar Modal -->
    <div id="sugar-modal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-50 hidden no-print">
        <div class="bg-white rounded-3xl p-8 md:p-10 max-w-lg w-full shadow-2xl relative transform scale-100">
            <button class="close-modal-btn absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <h3 class="text-2xl font-bold mb-6 text-gray-800">Add Blood Sugar Reading</h3>
            <div class="mb-6">
                <label for="sugar" class="block text-sm font-medium text-gray-700 mb-2">Sugar (mg/dL)</label>
                <input type="number" id="sugar" placeholder="e.g., 95" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors" />
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Reading Type</label>
                <div class="flex space-x-4">
                    <label class="inline-flex items-center">
                        <input type="radio" name="sugar-type" value="Fasting" class="form-radio text-indigo-600" checked>
                        <span class="ml-2 text-gray-700">Fasting</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="sugar-type" value="Random" class="form-radio text-indigo-600">
                        <span class="ml-2 text-gray-700">Random</span>
                    </label>
                </div>
            </div>
            <button id="submit-sugar" class="w-full bg-indigo-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:bg-indigo-700 transition-colors">Save Reading</button>
        </div>
    </div>
    
    <!-- Message Modal for errors and info -->
    <div id="message-modal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-50 hidden no-print">
        <div class="bg-white rounded-3xl p-8 md:p-10 max-w-lg w-full shadow-2xl relative transform scale-100 text-center">
            <h3 id="message-modal-title" class="text-2xl font-bold mb-4 text-gray-800"></h3>
            <p id="message-modal-message" class="text-gray-600 mb-6"></p>
            <button class="close-modal-btn w-full bg-indigo-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:bg-indigo-700 transition-colors">
                OK
            </button>
        </div>
    </div>
</body>
</html>
